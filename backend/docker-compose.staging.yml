# Staging backend on the BE server (172.28.92.57): the ECR API and its one-shot migration.
# The database is ApsaraDB RDS; the web app runs on the FE server (frontend/docker-compose.staging.yml).
# Run through backend/deploy/deploy-staging.sh, which passes --env-file backend/.env.staging.
name: ecr-staging

services:
  migrate:
    build: { context: .., dockerfile: backend/Dockerfile, target: build }
    image: ecr-tools:staging
    container_name: ecr-migrate-staging
    working_dir: /app/backend
    command: ["npx", "tsx", "src/scripts/migrate-cli.ts"]
    env_file: .env.staging
    restart: "no"

  api:
    build: { context: .., dockerfile: backend/Dockerfile, target: api }
    image: ecr-api:staging
    container_name: ecr-api-staging
    env_file: .env.staging
    environment:
      PORT: "3100"
      # Every stored file (source PDFs, imports, exports, evidence packs, review reports) goes to ECR's own folder on
      # the shared Synology NAS (SYNOLOGY-INTEGRATION.md): {root}/{deployment}/{slug} inside the container.
      STORAGE_SYNOLOGY_ROOT: /mnt/synology
      STORAGE_DEPLOYMENT: ${STORAGE_DEPLOYMENT:-dev}
      STORAGE_PROJECT_SLUG: ${STORAGE_PROJECT_SLUG:-ECR}
    volumes:
      # Only ECR's folder is bound: the server mounts NAS folder APPs/{deployment}/{slug} at STORAGE_HOST_PROJECT_DIR
      # (one mount per application), so the container never sees other systems' folders. It must already exist:
      # Docker is told not to create it, and the API does not create it either.
      - type: bind
        source: ${STORAGE_HOST_PROJECT_DIR:?set STORAGE_HOST_PROJECT_DIR in backend/.env.staging}
        target: /mnt/synology/${STORAGE_DEPLOYMENT:-dev}/${STORAGE_PROJECT_SLUG:-ECR}
        bind:
          create_host_path: false
    ports:
      # Private address only: the FE server's nginx is the one way in (TRUST_PROXY=1).
      - "${ECR_API_BIND:-172.28.92.57}:${ECR_API_PORT:-4160}:3100"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/api/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
