# Web app plus /api on one origin, as the WAF/SLB routing does in UAT and production (SameSite=Strict cookies).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Source documents up to 25 MB (MAX_SOURCE_BYTES) plus the multipart envelope.
    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://api:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
        try_files $uri /index.html;
    }
}
